name: flashcards-api
services:
  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeit
      POSTGRES_DB: flashcards_api

  # (formerly phpMyAdmin) - For a web interface to admin the PostgreSQL database
  adminer:
    image: adminer
    restart: always
    depends_on:
      - db
    ports:
      - 8080:8080

  sid_api:
    image: short-id-gen-api:0.1.0
    restart: always
    ports:
      - 9889:9889
    environment:
      SHARD_IDS: 1,2,3
      NANOID_LENGTH: 7
      PREFIX_ENABLED: true
